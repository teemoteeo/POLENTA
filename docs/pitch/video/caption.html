<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>POLENTA · caption</title>
<link rel="stylesheet" href="../fonts/fonts.css">
<!-- Didascalia sopra la demo nel video (record.mjs, clip con "cuts"): PNG trasparente 1920×1080.
     ?t=testo (*parola* in arancione) &s=riga piccola &n=1/5 -->
<style>
:root{--ink:#f2f3f5;--mute:#a3aab4;--accent:#ff5a1f}
*{box-sizing:border-box;margin:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:transparent}
.cap{position:absolute;left:640px;right:70px;bottom:96px;display:flex;justify-content:center}
.box{background:linear-gradient(160deg,rgba(30,34,44,.95),rgba(10,12,18,.93));border:1px solid rgba(255,255,255,.16);border-radius:24px;
  padding:22px 36px 26px;box-shadow:0 20px 60px rgba(0,0,0,.55);max-width:1200px}
.kick{font:400 19px "Space Mono",monospace;color:var(--mute);letter-spacing:.04em;margin-bottom:10px}
.kick b{font:400 19px "Michroma",sans-serif;color:var(--accent)}
.t{font:500 40px/1.22 "Libre Franklin",sans-serif;color:var(--ink)}
.t em{font-style:normal;color:var(--accent)}
.s{font:400 21px/1.4 "Space Mono",monospace;color:var(--mute);margin-top:12px}
.s:empty{display:none}
</style>
</head>
<body>
<div class="cap"><div class="box">
  <div class="kick"><b>POLENTA</b> · live app · <span id="n"></span></div>
  <div class="t" id="t"></div>
  <div class="s" id="s"></div>
</div></div>
<script>
const q = new URLSearchParams(location.search)
const esc = s => s.replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' })[c])
document.getElementById('t').innerHTML = esc(q.get('t') || '').replace(/\*(.+?)\*/g, '<em>$1</em>')
document.getElementById('s').textContent = q.get('s') || ''
document.getElementById('n').textContent = q.get('n') || ''
</script>
</body>
</html>
