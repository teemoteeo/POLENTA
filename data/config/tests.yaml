# tests.yaml — catalogo dei test (v2, 2026-11-15 00:20)
#
# Cos'è: per ogni test che un'azienda vuole fare, quali parametri contano e quanto.
# La pipeline lo legge per calcolare il punteggio delle celle della Terra, l'app per le card.
#
# Come si legge un test:
#   requisiti   param: peso. I nomi dei param sono quelli di params.csv. I pesi sommano a 1, minimo 0.05.
#               Il valore da imitare è quello del sito scelto (3 lunari, 2 marziani: targets.json), salvo `target` fisso.
#   filtri      condizioni dure: la cella è scartata se non le rispetta.
#   indoor      cosa la Terra non dà mai: la card propone la struttura di facilities.csv con quel `covers`.
#   validazione siti noti che devono uscire in alto (known_sites.csv). Se non escono, i pesi sono sbagliati.
#
# Regole comuni (archive/analog-atlas-plan.md §5.2):
#   s = exp(-(D/tau)^2) per parametro, D = distanza in percentili terrestri; totale = media geometrica pesata.
#   Un requisito con s < break_below è "si rompe" e va anche lui nella copertura indoor.
# Pesi: segnaposto ragionati da docs/requisiti-test.md §3 e docs/finaliste.md. Owner: Rocco.
# v2 (Edo, 15/11 00:20): 3 test, decisione del team sul testo della challenge: atterraggio con lidar,
#   rover, risorse in situ (ghiaccio e materiali) per una base permanente. Tolti camera, EVA, touchdown.
# v1 (Edo, 23:30): tutti e 5 i test sono nella demo (niente coming soon, ISRU tolto); filtro NDVI 0,2
#   (mediana dei mesi senza neve, sul pixel: docs/backend_spec.md sez. E); landing_touchdown nuovo;
#   ksc_alhat_field → death_valley (campo costruito, la cella H3 lo diluisce: docs/proposta-finale.md §6).

version: 0
tau: 0.1
eps: 0.01
break_below: 0.3

tests:

  rover_mobility:
    nome: Mobilità del rover
    profilo: rover
    stato: mvp
    cosa_si_testa: pendenze fino a 20°, rocce e gradini, affondamento nella regolite, navigazione con Sole radente
    aziende: [TAS-I (rover ETNA/ULS), ALTEC, AIKO, PoliTo]
    # 14/11 20:00 (Edo): bulk_density tolto dal punteggio: la densità della regolite si
    # riproduce in vasca di simulante (indoor: soil_density). Vedi docs/proposta-finale.md §7.
    requisiti:
      slope_p90: 0.35
      roughness: 0.15
      grain_proxy: 0.15
      rock_cover: 0.15
      low_sun_frac: 0.10
      crater_density: 0.05
      rock_class: 0.05
    filtri:
      ndvi: "< 0.2"
      slope_p90: ">= 15"
    indoor: [gravity_1_6, vacuum, electrostatic_dust, soil_density]
    validazione: [etna_piano_concazze, etna_cisternazza]

  flight_hda_lidar:
    nome: "Volo: rilevamento dei pericoli con lidar"
    profilo: landing_flight
    stato: mvp
    cosa_si_testa: il lidar del lander (o di un drone/elicottero che lo porta) vede rocce da 30 cm e pendenze da 5° e sceglie un punto sicuro
    aziende: [TAS-I (lander Argonaut), Evolunar (hopper), PoliTo PIC4SeR (drone)]
    requisiti:
      crater_density: 0.30
      rock_cover: 0.25
      slope_p90: 0.20
      roughness: 0.15
      albedo: 0.05
      rock_class: 0.05
    filtri:
      ndvi: "< 0.2"
    indoor: [gravity_1_6, plume_vacuum, vacuum]
    validazione: [cinder_lake, death_valley]

  isru_resources:
    nome: Risorse in situ per una base permanente
    profilo: isru
    stato: mvp
    cosa_si_testa: estrarre acqua dal ghiaccio nel suolo e lavorare la regolite (scavo, sinterizzazione, ossigeno); dove provare impianti, trivelle e simulanti
    aziende: [ALTEC (centro lunare), TAS-I (habitat MPH)]
    # 15/11 00:20 (Edo): pesi PROPOSTI, da confermare con Rocco. Ghiaccio: proxy MODIS (temperatura media annua
    # < −1 °C). Materiali: tessitura SoilGrids 0-5 cm. Il carbonio organico SoilGrids è inaffidabile nell'alto
    # Artico (Devon Island 110 g/kg, che è un deserto polare): sta nella card, non nel voto.
    requisiti:
      permafrost_share: 0.30
      sand_pct: 0.20
      clay_pct: 0.15
      grain_proxy: 0.15
      bulk_density_0_5: 0.10
      slope_p90: 0.10
    filtri:
      ndvi: "< 0.2"
    indoor: [vacuum, cryo_psr, agglutinates]
    validazione: []
